[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podium"
version = "0.1.0"
description = "Adaptive Revenue Recovery Intelligence for Razorpay AI Buildathon 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
podium-generate = "podium.cli:generate_data"
podium-run-case = "podium.cli:run_case"
podium-run-batch = "podium.cli:run_batch"
podium-evaluate = "podium.cli:run_evaluation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
